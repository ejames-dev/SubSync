name: Windows hotfix validation

on:
  push:
    branches:
      - codex/v1.1.3-windows-hotfix
    tags:
      - v1.1.3
  workflow_dispatch:

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace api

      - name: Test
        run: npm test

      - name: API end-to-end tests
        run: npm run test:e2e --workspace api

      - name: Build Windows package
        run: npm run build:desktop && npx electron-builder --win portable --publish never

      - name: Generate update manifest
        run: npm run manifest:desktop:windows

      - name: Smoke-test packaged app
        shell: pwsh
        run: ./desktop/smoke-windows-package.ps1

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: subsync-v1.1.3-windows
          path: |
            release/SubSync-1.1.3.exe
            release/latest.yml
          retention-days: 14
