name: Release

# Builds and publishes desktop artifacts for all platforms to a draft GitHub
# Release named after the package.json version. Publish the draft manually
# after running the checks in docs/release-checklist.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DATABASE_URL: 'file:./dev.db'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-15
            args: --mac --arm64
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SUBSYNC_MACOS_SIGNED: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
      # Fall back to unsigned builds cleanly when CSC_LINK is not configured.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace api

      - name: Run unit & e2e tests before release
        run: npm test && npm run test:e2e --workspace api

      - name: Build desktop bundle
        run: npm run build:desktop

      - name: Package and publish
        run: npx electron-builder ${{ matrix.args }} --publish always
